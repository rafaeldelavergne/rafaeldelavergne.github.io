const places={
town:{eyebrow:'An ongoing exploration',title:'What does it mean<br>to <i>be yourself?</i>',body:'<p>I’m Rafaël. This is a small map of the things I’m building, thinking about, and learning to live.</p><p>There’s a home, a library, a workshop, and a garden. Nothing to complete. Just a few places to explore.</p>',hint:'Click a building to step inside. The same places are listed below the map.',scene:town,caption:'A small world / 01',instruction:'Choose a place. Take your time.'},
home:{eyebrow:'01 / Home',title:'A life,<br><i>in progress.</i>',body:'<p>I was asking what it means to be myself before TOTEM. It has shaped what I build, how I help people, and how I live.</p><p>Some of that story is at work. Some of it is elsewhere.</p>',links:[['home/work','At work','Experience'],['home/life','In life','Curiosity']],scene:home,caption:'Home / 02',instruction:'The desk or the living room?'},
library:{eyebrow:'02 / The library',title:'Questions worth<br><i>staying with.</i>',body:'<p>I’m starting to write about the beliefs we inherit, the choices we make, and what I’m learning by trying things in my own life.</p><p>The shelves are still being filled. My first essays will live here.</p>',links:[['library/essays','Essays','Coming soon']],scene:library,caption:'The library / 02',instruction:'Visit the reading table.'},
workshop:{eyebrow:'03 / The workshop',title:'Thinking<br><i>by making.</i>',body:'<p>A few ideas I’m trying to turn into something useful.</p><p>Choose a workbench to see what I’m working on, and where it stands.</p>',links:[['workshop/compass','Compass','In development'],['workshop/game','Being yourself','Game concept']],scene:workshop,caption:'The workshop / 02',instruction:'Choose a workbench to look closer.'},
garden:{eyebrow:'04 / The garden',title:'A little room<br><i>to think.</i>',body:'<p>Are you satisfied with your life right now? At work? In life?</p><p>Sometimes we need to look closely at what is happening. Sometimes we need to step back.</p><p>This is where I share how I approach coaching and conversations.</p>',links:[['garden/zoom-in','Zoom in','Right now'],['garden/zoom-out','Zoom out','Wider picture'],['garden/conversation','A conversation','If you’d like']],scene:garden,caption:'The garden / 02',instruction:'Choose a place to pause.'}
};
const details={
'workshop/compass':{title:'Compass',status:'In development',body:'<p>A tool to connect the direction you choose with what you do.</p><p>The question I’m exploring here is how to connect what we say matters with what we actually do, personally and at work.</p>',link:['https://compass-me.ai','Visit Compass ↗']},
'workshop/game':{title:'A game about<br>being yourself',status:'Concept',body:'<p>An idea for adolescents to explore inherited beliefs, make choices, and see their consequences through play.</p><p>I want to make room for questions about parents, belonging, and finding your own direction—through a game people want to play.</p>'},
'home/work':{title:'At work',meta:'École Polytechnique, X2013 · UC Berkeley',body:'<p>I co-founded TOTEM in 2017 with a question: how could I create a place where people could be themselves?</p><p>For customers, it started around the coffee machine. For employees, it meant the culture we built. For me, it meant finding my own way to be an entrepreneur.</p><div class="stats"><div><strong>€10m</strong><span>Raised for TOTEM</span></div><div><strong>€4m</strong><span>Annual recurring revenue</span></div><div><strong>40</strong><span>Employees</span></div><div><strong>15,000</strong><span>Customers per month</span></div></div><p>I also trained with Jean-Daniel Rémond and have coached founders from seed to Series B.</p>',link:['/#about','Read my full background →']},
'home/life':{title:'In life',body:'<p>I dance and I climb. I like the concentration climbing asks for: trying a movement, understanding what went wrong, and trying again.</p><p>My curiosity takes me into philosophy, neuroscience, and wisdom traditions from East and West, including shamanism.</p><p>I explore them for myself, looking at what I can question, try, and bring back into everyday life.</p>'},
'library/essays':{title:'Essays',status:'First essays coming soon',body:'<p>Notes from an unfinished exploration.</p><p>I’m writing about the beliefs we inherit, the choices we make, and what I’m learning by trying things in my own life.</p><p>No reading list to catch up on yet. There’s room here for what comes next.</p>'},
'garden/zoom-in':{title:'Zoom in',meta:'What needs your attention now?',body:'<p>We start with what brings you here and create space to think. What’s happening? What do you need? What could you do next?</p><p>Some conversations I have: a founder who wants to leave after ten years but doesn’t know how; someone whose company is successful but who is unhappy with their life; a leader who feels close to burnout.</p><p>We look at what you want, what you feel obliged to do, and what makes it difficult to choose.</p>'},
'garden/zoom-out':{title:'Zoom out',meta:'What kind of life do you want?',body:'<p>Work can take up much of our lives while drawing on only part of who we are.</p><p>In coaching, I look at six dimensions of energy: <strong>physical, emotional, mental, social, spiritual, and creative.</strong></p><p>What gives you energy? What drains it? What have you left little room for?</p><p>Then we bring it back to life: a choice, a conversation, a boundary, or something to try.</p>'},
'garden/conversation':{title:'A conversation',body:'<p>If there’s a question you’d like to explore together, you’re welcome to get in touch.</p><p>I spent eight years building TOTEM, trained with Jean-Daniel Rémond, and have coached founders from seed to Series B.</p><p>You can read more about my approach before deciding whether it feels right for you.</p>',link:['/#coaching','Read about coaching →'],second:['https://calendly.com/rafael-delavergne','Find a time to talk ↗']}
};
let current='',timer=0,pendingOrigin='50% 50%',motionOff=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene=document.getElementById('scene'),reading=document.getElementById('reading'),motion=document.getElementById('motion');
function safeRoute(){const key=location.hash.slice(1);return places[key]||details[key]?key:'town'}
function placeNav(base){return Object.entries(places).map(([key,val])=>'<a href="#'+key+'"'+(key===base?' aria-current="page"':'')+'>'+names[key]+'</a>').join('')}
function links(items){return '<nav class="place-links" aria-label="Explore this place">'+items.map(item=>'<a href="#'+item[0]+'">'+item[1]+'<span>'+item[2]+' →</span></a>').join('')+'</nav>'}
function external(pair){return '<a class="reading-link" href="'+pair[0]+'"'+(pair[0].startsWith('https:')?' target="_blank" rel="noopener noreferrer"':'')+'>'+pair[1]+'</a>'}
function paint(key,focus){
const base=key.split('/')[0],page=places[base],detail=details[key];
let content='<p class="eyebrow">'+page.eyebrow+'</p>';
if(detail){content='<a class="back-link" href="#'+base+'">← Back to '+names[base].toLowerCase()+'</a>'+content+'<h1 id="reading-title" class="detail-title" tabindex="-1">'+detail.title+'</h1>'+(detail.meta?'<p class="detail-meta">'+detail.meta+'</p>':'')+(detail.status?'<span class="status">'+detail.status+'</span>':'')+'<div class="description">'+detail.body+'</div>'+(detail.link?external(detail.link):'')+(detail.second?'<p>'+external(detail.second)+'</p>':'');}
else{content+='<h1 id="reading-title" tabindex="-1">'+page.title+'</h1><div class="description">'+page.body+'</div>'+(page.links?links(page.links):'')+(page.hint?'<p class="hint">'+page.hint+'</p>':'');}
reading.innerHTML=content;
const previousBase=current.split('/')[0];if(base!==previousBase||!current)scene.innerHTML=page.scene();
document.getElementById('map-caption').textContent=page.caption;
document.getElementById('map-instruction').textContent=detail?'Use the map to explore another spot.':page.instruction;
document.getElementById('map-links').innerHTML=placeNav(base);
document.getElementById('breadcrumb').innerHTML=base==='town'?'<span aria-current="page">The town</span>':'<a href="#town">The town</a><span aria-hidden="true">/</span>'+(detail?'<a href="#'+base+'">'+names[base]+'</a><span aria-hidden="true">/</span><span aria-current="page">'+names[key]+'</span>':'<span aria-current="page">'+names[base]+'</span>');
document.title=(names[key]||'A small world')+' — Rafaël de Lavergne';
document.getElementById('announcement').textContent=(detail?names[key]+' opened.':names[base]+' map opened.');
current=key;if(focus)document.getElementById('reading-title').focus({preventScroll:true});
}
function navigate(){
const key=safeRoute();if(key===current)return;clearTimeout(timer);
const different=key.split('/')[0]!==current.split('/')[0];
if(current&&different&&!motionOff){
scene.style.transformOrigin=pendingOrigin;scene.className='scene exiting';
timer=setTimeout(()=>{paint(key,true);scene.className='scene arriving';scene.style.transformOrigin='50% 50%';requestAnimationFrame(()=>requestAnimationFrame(()=>{scene.className='scene'}));},280);
}else{scene.className='scene';paint(key,!!current);}
pendingOrigin='50% 50%';
}
function updateMotion(){motion.setAttribute('aria-pressed',String(motionOff));motion.textContent=motionOff?'Motion off':'Motion on'}
motion.addEventListener('click',()=>{motionOff=!motionOff;updateMotion()});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-origin]');if(a)pendingOrigin=a.dataset.origin});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current!=='town')location.hash=current.includes('/')?current.split('/')[0]:'town'});
window.addEventListener('hashchange',navigate);updateMotion();navigate();
</script></body></html>
